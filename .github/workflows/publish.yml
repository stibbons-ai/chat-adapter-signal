name: Publish

on:
  push:
    tags: ["v*"]

# npm trusted publishing (OIDC): no NPM_TOKEN. One-time npmjs.com setup: CONTRIBUTING.md.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Trusted publishing needs a GitHub-hosted runner and npm >= 11.5.1 (bundled with Node 24.5+).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no cache in release builds
      # No dependency install scripts while this job can mint a publish token; prepack still builds.
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm publish --provenance --access public
