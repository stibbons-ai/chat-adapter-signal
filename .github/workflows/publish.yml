name: Publish

on:
  push:
    tags: ["v*"]

# npm trusted publishing (OIDC): no NPM_TOKEN; id-token mints the short-lived publish credential
# and the provenance attestation. See CONTRIBUTING.md for the one-time npmjs.com setup.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Trusted publishing needs a GitHub-hosted runner, npm >= 11.5.1 and Node >= 22.14.0;
    # current Node 24 releases bundle npm >= 11.5.1 (24.14: npm 11.9).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no cache in release builds
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
